services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: climateguard-sqlserver
    hostname: climateguard-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Developer"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    networks:
      - climateguard-network

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s


  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: climateguard-db-init

    depends_on:
      sqlserver:
        condition: service_healthy

    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

    volumes:
      - ./database/ClimateGuard.sql:/scripts/ClimateGuard.sql:ro
      - ./docker/db_init/init-database.sh:/scripts/init-database.sh:ro

    entrypoint:
      - /bin/bash
      - /scripts/init-database.sh

    networks:
      - climateguard-network

    restart: "no"


volumes:

  sqlserver_data:
    name: climateguard-sqlserver-data


networks:

  climateguard-network:
    name: climateguard-network
    driver: bridge