services:
  gateway:
    image: climateguard-gateway:local
    build:
      context: ../..
      dockerfile: gateway/ClimateGuard.Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Jwt__Key: ${JWT_ACCESS_SECRET:?Falta JWT_ACCESS_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:?Falta JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE:?Falta JWT_AUDIENCE}
      ReverseProxy__Clusters__auth-service__Destinations__primary__Address: http://host.docker.internal:7101/
      ReverseProxy__Clusters__legacy-api__Destinations__primary__Address: http://host.docker.internal:7000/
    networks:
      - gateway-network
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:5147:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
    networks:
      - gateway-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  gateway-network:
    driver: bridge