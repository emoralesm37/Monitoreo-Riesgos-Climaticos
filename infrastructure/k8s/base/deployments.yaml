        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: auth-service
        image: climateguard/auth-service:candidate
        imagePullPolicy: IfNotPresent
        ports:
