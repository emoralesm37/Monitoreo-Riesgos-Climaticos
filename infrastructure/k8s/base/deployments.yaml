        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: report-service
        image: climateguard/report-service:candidate
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt
              key: access-key
        - name: JWT_ISSUER
          valueFrom:
            configMapKeyRef:
              name: runtime
              key: JWT_ISSUER
        - name: JWT_AUDIENCE
          valueFrom:
            configMapKeyRef:
              name: runtime
              key: JWT_AUDIENCE
        - name: MONGO_HOST
          valueFrom:
            configMapKeyRef:
              name: runtime
              key: MONGO_HOST
        - name: MONGO_PORT
          valueFrom:
            configMapKeyRef:
              name: runtime
              key: MONGO_PORT
        - name: MONGO_DATABASE
          value: ClimateGuardReports
        - name: MONGO_REPORT_USERNAME
          valueFrom:
            secretKeyRef:
              name: report-db
              key: username
        - name: MONGO_REPORT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: report-db
              key: password
        - name: COMMUNITY_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: runtime
              key: COMMUNITY_SERVICE_URL
        - name: SENSOR_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: runtime
              key: SENSOR_SERVICE_URL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1500m
            memory: 1536Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: pdfs
          mountPath: /opt/climateguard/services/report-service/app/generated
        readinessProbe:
          httpGet:
            path: /health/database
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/database
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        command:
        - python
        - -m
        - uvicorn
        args:
        - app.main:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --limit-concurrency
        - '4'
        - --no-access-log
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: pdfs
        persistentVolumeClaim:
          claimName: report-pdfs
      terminationGracePeriodSeconds: 60
---
