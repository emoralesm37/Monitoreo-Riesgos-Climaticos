        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: alert-service
        image: climateguard/alert-service:candidate
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 7301
        env:
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt
              key: access-key
        - name: JWT_ISSUER
          valueFrom:
            configMapKeyRef:
              name: runtime
              key: JWT_ISSUER
        - name: JWT_AUDIENCE
          valueFrom:
            configMapKeyRef:
              name: runtime
              key: JWT_AUDIENCE
        - name: SERVER_PORT
          value: '7301'
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://alert-db:5432/climateguard_alert
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: alert-db-app
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: alert-db-app
              key: password
        - name: ALERT_RULES_URL
          valueFrom:
            configMapKeyRef:
              name: runtime
              key: ALERT_RULES_URL
        - name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE
          value: readinessState,db
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=20
        - name: SPRING_FLYWAY_ENABLED
          value: 'true'
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      terminationGracePeriodSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
