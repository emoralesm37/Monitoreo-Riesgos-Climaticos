            configMapKeyRef:
              name: runtime
              key: JWT_ISSUER
        - name: JWT_AUDIENCE
          valueFrom:
            configMapKeyRef:
              name: runtime
              key: JWT_AUDIENCE
        - name: NODE_ENV
          value: production
        - name: PORT
          value: '7101'
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: runtime
              key: AUTH_DB_HOST
        - name: DB_PORT
          value: '5432'
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: runtime
              key: AUTH_DB_NAME
        - name: DB_SSL
          value: 'false'
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: auth-db-app
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-db-app
              key: password
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt
              key: refresh-key
        - name: JWT_ACCESS_TTL_SECONDS
          value: '900'
        - name: JWT_REFRESH_TTL_SECONDS
          value: '604800'
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      terminationGracePeriodSeconds: 60
