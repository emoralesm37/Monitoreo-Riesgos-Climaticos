apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gateway-outbox
  labels:
    app.kubernetes.io/part-of: climateguard
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: report-pdfs
  labels:
    app.kubernetes.io/part-of: climateguard
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
