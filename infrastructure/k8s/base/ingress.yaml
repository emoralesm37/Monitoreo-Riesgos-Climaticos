apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public
  labels:
    app.kubernetes.io/part-of: climateguard
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - climateguard.invalid
    secretName: climateguard-tls
  rules:
  - host: climateguard.invalid
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 8080
