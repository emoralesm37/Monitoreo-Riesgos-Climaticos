apiVersion: batch/v1
kind: Job
metadata:
  name: auth-migrate
  labels:
    app.kubernetes.io/part-of: climateguard
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bootstrap
        app.kubernetes.io/part-of: climateguard
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: auth-migrate
        image: climateguard/auth-service:candidate
        command:
        - node
        - /app/node_modules/typeorm/cli.js
        - migration:run
        - -d
        - /app/dist/database/data-source.js
        env:
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt
              key: access-key
        - name: JWT_ISSUER
          valueFrom:
            configMapKeyRef:
              name: runtime
              key: JWT_ISSUER
        - name: JWT_AUDIENCE
          valueFrom:
            configMapKeyRef:
              name: runtime
              key: JWT_AUDIENCE
        - name: NODE_ENV
          value: production
        - name: PORT
          value: '7101'
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: runtime
              key: AUTH_DB_HOST
        - name: DB_PORT
          value: '5432'
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: runtime
              key: AUTH_DB_NAME
        - name: DB_SSL
          value: 'false'
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: auth-db-app
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-db-app
              key: password
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt
              key: refresh-key
        - name: JWT_ACCESS_TTL_SECONDS
          value: '900'
        - name: JWT_REFRESH_TTL_SECONDS
          value: '604800'
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: scripts
          mountPath: /bootstrap
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: scripts
        configMap:
          name: bootstrap-scripts
      - name: tmp
        emptyDir: {}
---
