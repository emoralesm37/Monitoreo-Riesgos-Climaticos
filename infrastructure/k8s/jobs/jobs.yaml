apiVersion: batch/v1
kind: Job
metadata:
  name: provision-auth-db
  labels:
    app.kubernetes.io/part-of: climateguard
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bootstrap
        app.kubernetes.io/part-of: climateguard
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: provision-auth-db
        image: climateguard/auth-service:candidate
        command:
        - node
        - /bootstrap/provision-postgres.cjs
        env:
        - name: PGHOST
          value: auth-db
        - name: APP_DATABASE
          value: climateguard_auth
        - name: ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-db-admin
              key: password
        - name: APP_USER
          valueFrom:
            secretKeyRef:
              name: auth-db-app
              key: username
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-db-app
              key: password
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: scripts
          mountPath: /bootstrap
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: scripts
        configMap:
          name: bootstrap-scripts
      - name: tmp
        emptyDir: {}
---
