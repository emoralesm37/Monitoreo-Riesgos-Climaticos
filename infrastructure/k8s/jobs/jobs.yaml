apiVersion: batch/v1
kind: Job
metadata:
  name: sql-empty-schema
  labels:
    app.kubernetes.io/part-of: climateguard
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bootstrap
        app.kubernetes.io/part-of: climateguard
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: sql-empty-schema
        image: mcr.microsoft.com/mssql/server:2022-latest
        command:
        - sh
        - -ec
        - export SQLCMDPASSWORD="$MSSQL_SA_PASSWORD"; /opt/mssql-tools18/bin/sqlcmd
          -S sqlserver -U sa -C -b -Q "IF DB_ID(N'ClimateGuard') IS NULL EXEC('CREATE
          DATABASE [ClimateGuard]')"; /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U
          sa -C -b -d ClimateGuard -i /bootstrap/sql-schema.sql
        env:
        - name: MSSQL_SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sql-admin
              key: password
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: scripts
          mountPath: /bootstrap
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: scripts
        configMap:
          name: bootstrap-scripts
      - name: tmp
        emptyDir: {}
