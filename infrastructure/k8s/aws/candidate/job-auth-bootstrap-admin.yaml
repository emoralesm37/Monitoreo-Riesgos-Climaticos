apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/part-of: climateguard
  name: auth-bootstrap-admin
  namespace: climateguard
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bootstrap
        app.kubernetes.io/part-of: climateguard
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - node
        - /bootstrap/bootstrap-admin.cjs
        env:
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              key: access-key
              name: jwt
        - name: JWT_ISSUER
          valueFrom:
            configMapKeyRef:
              key: JWT_ISSUER
              name: runtime
        - name: JWT_AUDIENCE
          valueFrom:
            configMapKeyRef:
              key: JWT_AUDIENCE
              name: runtime
        - name: NODE_ENV
          value: production
        - name: PORT
          value: '7101'
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              key: AUTH_DB_HOST
              name: runtime
        - name: DB_PORT
          value: '5432'
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              key: AUTH_DB_NAME
              name: runtime
        - name: DB_SSL
          value: 'false'
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: auth-db-app
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: auth-db-app
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              key: refresh-key
              name: jwt
        - name: JWT_ACCESS_TTL_SECONDS
          value: '900'
        - name: JWT_REFRESH_TTL_SECONDS
          value: '604800'
        - name: INITIAL_ADMIN_NAME
          valueFrom:
            secretKeyRef:
              key: name
              name: bootstrap-admin
        - name: INITIAL_ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              key: email
              name: bootstrap-admin
        - name: INITIAL_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: bootstrap-admin
        image: climateguard/auth-service:release-20261106-f0048fcb2ff2
        name: auth-bootstrap-admin
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /bootstrap
          name: scripts
          readOnly: true
        - mountPath: /tmp
          name: tmp
        imagePullPolicy: Never
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: bootstrap-scripts-fh4cbgbfdm
        name: scripts
      - emptyDir: {}
        name: tmp
