provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/part-of: climateguard
  name: climateguard
---
apiVersion: v1
data:
  appsettings.json: "{\r\n  \"Logging\": {\r\n    \"LogLevel\": {\r\n      \"Default\"\
    : \"Information\",\r\n      \"Microsoft.AspNetCore\": \"Warning\"\r\n    }\r\n\
    \  }\r\n}\r\n"
kind: ConfigMap
metadata:
  name: dotnet-settings-kf65bh8d9f
  namespace: climateguard
---
apiVersion: v1
data:
  nginx.conf: "worker_processes auto;\npid /tmp/nginx.pid;\nevents { worker_connections\
    \ 1024; }\nhttp {\n  include /etc/nginx/mime.types;\n  default_type application/octet-stream;\n\
    \  access_log off;\n  error_log /dev/stderr warn;\n  server_tokens off;\n  sendfile\
    \ on;\n  client_body_temp_path /tmp/client_temp;\n  proxy_temp_path /tmp/proxy_temp;\n\
    \  fastcgi_temp_path /tmp/fastcgi_temp;\n  uwsgi_temp_path /tmp/uwsgi_temp;\n\
    \  scgi_temp_path /tmp/scgi_temp;\n  server {\n    listen 8080;\n    root /usr/share/nginx/html;\n\
    \    index index.html;\n    location = /healthz { default_type text/plain; return\
    \ 200 'ok'; }\n    location = /index.html { add_header Cache-Control 'no-store';\
    \ }\n    location /api/ { return 404; }\n    location / { try_files $uri $uri/\
    \ /index.html; }\n  }\n}\n"
kind: ConfigMap
metadata:
  name: frontend-settings-29gh7h769f
  namespace: climateguard
---
apiVersion: v1
data:
  appsettings.json: "{\n  \"Logging\": {\n    \"LogLevel\": {\n      \"Default\":\
    \ \"Information\",\n      \"Microsoft.AspNetCore\": \"Warning\",\n      \"Yarp.ReverseProxy\"\
    : \"Warning\"\n    }\n  },\n  \"Cors\": {\n    \"AllowedOrigins\": [\n      \"\
    https://climateguard.garher.lat\"\n    ]\n  },\n  \"Audit\": {\n    \"Enabled\"\
    : true,\n    \"IngestUrl\": \"http://audit-service:8001/internal/events\",\n \
    \   \"OutboxDirectory\": \"/var/lib/climateguard/audit-outbox\"\n  },\n  \"ReverseProxy\"\
    : {\n    \"Routes\": {\n      \"auth\": {\n        \"ClusterId\": \"auth-service\"\
    ,\n        \"Match\": {\n          \"Path\": \"/api/auth/{**remainder}\"\n   \
    \     },\n        \"AuthorizationPolicy\": \"anonymous\",\n        \"Transforms\"\
    : [\n          {\n            \"PathRemovePrefix\": \"/api\"\n          }\n  \
    \      ]\n      },\n      \"users\": {\n        \"ClusterId\": \"auth-service\"\
    ,\n        \"Match\": {\n          \"Path\": \"/api/users/{**remainder}\"\n  \
    \      },\n        \"AuthorizationPolicy\": \"Administrators\",\n        \"Transforms\"\
    : [\n          {\n            \"PathRemovePrefix\": \"/api\"\n          }\n  \
    \      ]\n      },\n      \"roles\": {\n        \"ClusterId\": \"auth-service\"\
    ,\n        \"Match\": {\n          \"Path\": \"/api/roles/{**remainder}\"\n  \
    \      },\n        \"AuthorizationPolicy\": \"Administrators\",\n        \"Transforms\"\
    : [\n          {\n            \"PathRemovePrefix\": \"/api\"\n          }\n  \
    \      ]\n      },\n      \"communities\": {\n        \"ClusterId\": \"legacy-api\"\
    ,\n        \"Match\": {\n          \"Path\": \"/api/communities/{**remainder}\"\
    \n        }\n      },\n      \"sensors\": {\n        \"ClusterId\": \"sensor-service\"\
    ,\n        \"Match\": {\n          \"Path\": \"/api/sensors/{**remainder}\"\n\
    \        }\n      },\n      \"catalogs\": {\n        \"ClusterId\": \"legacy-api\"\
    ,\n        \"Match\": {\n          \"Path\": \"/api/catalogs/{**remainder}\"\n\
    \        }\n      },\n      \"rules\": {\n        \"ClusterId\": \"legacy-api\"\
    ,\n        \"Match\": {\n          \"Path\": \"/api/alert-rules/{**remainder}\"\
    \n        }\n      },\n      \"alerts\": {\n        \"ClusterId\": \"alert-service\"\
    ,\n        \"Match\": {\n          \"Path\": \"/api/alerts/{**remainder}\"\n \
    \       }\n      },\n      \"reports\": {\n        \"ClusterId\": \"report-service\"\
    ,\n        \"Match\": {\n          \"Path\": \"/api/reports/{**remainder}\"\n\
    \        },\n        \"AuthorizationPolicy\": \"Administrators\"\n      },\n \
    \     \"audit\": {\n        \"ClusterId\": \"audit-service\",\n        \"Match\"\
    : {\n          \"Path\": \"/api/audit/events\",\n          \"Methods\": [\n  \
    \          \"GET\"\n          ]\n        },\n        \"AuthorizationPolicy\":\
    \ \"Administrators\"\n      }\n    },\n    \"Clusters\": {\n      \"auth-service\"\
    : {\n        \"Destinations\": {\n          \"primary\": {\n            \"Address\"\
    : \"http://auth-service:7101/\"\n          }\n        }\n      },\n      \"legacy-api\"\
    : {\n        \"Destinations\": {\n          \"primary\": {\n            \"Address\"\
    : \"http://legacy-api:8080/\"\n          }\n        }\n      },\n      \"sensor-service\"\
    : {\n        \"Destinations\": {\n          \"primary\": {\n            \"Address\"\
    : \"http://sensor-service:8080/\"\n          }\n        }\n      },\n      \"\
    alert-service\": {\n        \"Destinations\": {\n          \"primary\": {\n  \
    \          \"Address\": \"http://alert-service:7301/\"\n          }\n        }\n\
    \      },\n      \"report-service\": {\n        \"Destinations\": {\n        \
    \  \"primary\": {\n            \"Address\": \"http://report-service:8000/\"\n\
    \          }\n        }\n      },\n      \"audit-service\": {\n        \"Destinations\"\
    : {\n          \"primary\": {\n            \"Address\": \"http://audit-service:8001/\"\
    \n          }\n        }\n      }\n    }\n  }\n}"
