apiVersion: v1
kind: ConfigMap
metadata:
  name: release-probe-code
  namespace: climateguard
data:
  internal-probe.cjs: "// Prepared Job: real DNS + dependency readiness, no credentials\
    \ or business writes.\nconst dns = require('node:dns/promises');\nconst targets\
    \ = [\n  ['frontend',8080,'/healthz'], ['gateway',8080,'/health/ready'],\n  ['auth-service',7101,'/health'],\
    \ ['legacy-api',8080,'/health/database'],\n  ['sensor-service',8080,'/health/database'],\
    \ ['alert-service',7301,'/actuator/health/readiness'],\n  ['report-service',8000,'/health/database'],\
    \ ['audit-service',8001,'/health'],\n];\nasync function main() {\n  const results=[];\n\
    \  for (const [name,port,route] of targets) {\n    const host=name+'.climateguard.svc.cluster.local';\n\
    \    try {\n      const addresses=await dns.resolve4(host);\n      results.push({name,check:'DNS',passed:addresses.length>0});\n\
    \      const response=await fetch('http://'+host+':'+port+route,{signal:AbortSignal.timeout(10000),redirect:'error'});\n\
    \      await response.arrayBuffer();\n      results.push({name,check:'readiness',status:response.status,passed:response.status===200});\n\
    \    } catch {results.push({name,check:'DNS/readiness',passed:false});}\n  }\n\
    \  console.log(JSON.stringify({scope:'real internal readiness; not business E2E',results}));\n\
    \  if(results.some(r=>!r.passed))process.exitCode=1;\n}\nmain().catch(()=>{console.error('Internal\
    \ acceptance failed');process.exitCode=1;});\n"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: release-probe-egress
  namespace: climateguard
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: release-probe
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - alert-service
          - audit-service
          - auth-service
          - frontend
          - gateway
          - legacy-api
          - report-service
          - sensor-service
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 7101
    - protocol: TCP
      port: 7301
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 8001
---
