apiVersion: batch/v1
kind: Job
metadata:
  name: release-internal-probe
  namespace: climateguard
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: release-probe
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: probe
        image: climateguard/auth-service:release-20261106-f0048fcb2ff2
        imagePullPolicy: Never
        command:
        - node
        - /probe/internal-probe.cjs
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: code
          mountPath: /probe
          readOnly: true
      volumes:
      - name: code
        configMap:
          name: release-probe-code
