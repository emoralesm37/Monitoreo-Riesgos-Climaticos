              127.0.0.1 -U sa -C -l 3 -b -Q "SET NOCOUNT ON; SELECT 1" -o /dev/null
          failureThreshold: 3
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 2000m
            memory: 3Gi
          requests:
            cpu: 1000m
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        startupProbe:
          failureThreshold: 60
          periodSeconds: 5
          tcpSocket:
            port: db
        volumeMounts:
        - mountPath: /var/opt/mssql
          name: data
        - mountPath: /tmp
          name: tmp
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/os: linux
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
      volumes:
      - emptyDir:
          sizeLimit: 256Mi
        name: tmp
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 40Gi
      storageClassName: cg-retain
