    \n        }\n      },\n      \"sensors\": {\n        \"ClusterId\": \"sensor-service\"\
    ,\n        \"Match\": {\n          \"Path\": \"/api/sensors/{**remainder}\"\n\
    \        }\n      },\n      \"catalogs\": {\n        \"ClusterId\": \"legacy-api\"\
    ,\n        \"Match\": {\n          \"Path\": \"/api/catalogs/{**remainder}\"\n\
    \        }\n      },\n      \"rules\": {\n        \"ClusterId\": \"legacy-api\"\
    ,\n        \"Match\": {\n          \"Path\": \"/api/alert-rules/{**remainder}\"\
    \n        }\n      },\n      \"alerts\": {\n        \"ClusterId\": \"alert-service\"\
    ,\n        \"Match\": {\n          \"Path\": \"/api/alerts/{**remainder}\"\n \
    \       }\n      },\n      \"reports\": {\n        \"ClusterId\": \"report-service\"\
    ,\n        \"Match\": {\n          \"Path\": \"/api/reports/{**remainder}\"\n\
    \        },\n        \"AuthorizationPolicy\": \"Administrators\"\n      },\n \
    \     \"audit\": {\n        \"ClusterId\": \"audit-service\",\n        \"Match\"\
    : {\n          \"Path\": \"/api/audit/events\",\n          \"Methods\": [\n  \
    \          \"GET\"\n          ]\n        },\n        \"AuthorizationPolicy\":\
    \ \"Administrators\"\n      }\n    },\n    \"Clusters\": {\n      \"auth-service\"\
    : {\n        \"Destinations\": {\n          \"primary\": {\n            \"Address\"\
    : \"http://auth-service:7101/\"\n          }\n        }\n      },\n      \"legacy-api\"\
    : {\n        \"Destinations\": {\n          \"primary\": {\n            \"Address\"\
    : \"http://legacy-api:8080/\"\n          }\n        }\n      },\n      \"sensor-service\"\
    : {\n        \"Destinations\": {\n          \"primary\": {\n            \"Address\"\
    : \"http://sensor-service:8080/\"\n          }\n        }\n      },\n      \"\
    alert-service\": {\n        \"Destinations\": {\n          \"primary\": {\n  \
    \          \"Address\": \"http://alert-service:7301/\"\n          }\n        }\n\
    \      },\n      \"report-service\": {\n        \"Destinations\": {\n        \
    \  \"primary\": {\n            \"Address\": \"http://report-service:8000/\"\n\
