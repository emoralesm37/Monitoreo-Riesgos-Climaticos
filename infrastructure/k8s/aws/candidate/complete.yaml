    app.kubernetes.io/part-of: climateguard
  name: report-service-to-mongodb
  namespace: climateguard
spec:
  egress:
  - ports:
    - port: 27017
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: climateguard
      podSelector:
        matchLabels:
          app.kubernetes.io/name: mongodb
  podSelector:
    matchLabels:
      app.kubernetes.io/name: report-service
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: climateguard
  name: sensor-service-from-gateway
  namespace: climateguard
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: climateguard
      podSelector:
        matchLabels:
          app.kubernetes.io/name: gateway
    ports:
    - port: 8080
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sensor-service
  policyTypes:
  - Ingress
