  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-service
        app.kubernetes.io/part-of: climateguard
      annotations:
        climateguard.io/config-checksum: cc52c5ef10f3dc24bb8135a7419e0c51c1644bd46760573fd6e0697bd348944d
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              key: access-key
              name: jwt
        - name: JWT_ISSUER
          valueFrom:
            configMapKeyRef:
              key: JWT_ISSUER
              name: runtime
        - name: JWT_AUDIENCE
          valueFrom:
            configMapKeyRef:
              key: JWT_AUDIENCE
              name: runtime
        - name: SERVER_PORT
          value: '7301'
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://alert-db:5432/climateguard_alert
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: alert-db-app
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: alert-db-app
        - name: ALERT_RULES_URL
          valueFrom:
            configMapKeyRef:
              key: ALERT_RULES_URL
              name: runtime
        - name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE
          value: readinessState,db
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=20
        - name: SPRING_FLYWAY_ENABLED
          value: 'true'
        image: climateguard/alert-service:release-20261106-f0048fcb2ff2
        imagePullPolicy: Never
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
        name: alert-service
        ports:
        - containerPort: 7301
          name: http
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 1500m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      volumes:
      - emptyDir:
          sizeLimit: 256Mi
        name: tmp
