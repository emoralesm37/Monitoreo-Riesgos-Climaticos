apiVersion: v1
kind: ConfigMap
metadata:
  name: sql-app-bootstrap-scripts
  namespace: climateguard
data:
  provision-sql-app.sh: "#!/bin/bash\n# Explicit one-off job, only against the NEW\
    \ namespace SQL instance.\n# Passwords travel through env/SQLCMD substitution,\
    \ never CLI arguments or output.\nset -euo pipefail\n[[ \"${CG_SQL_APP_USER:-}\"\
    \ =~ ^[a-z][a-z0-9_]{2,40}$ ]] || exit 2\n# Fresh credentials must use this alphabet;\
    \ excludes SQL quoting/substitution syntax.\n[[ \"${CG_SQL_APP_PASSWORD:-}\" =~\
    \ ^[A-Za-z0-9_!@#%+-]{32,128}$ ]] || exit 2\nexport SQLCMDPASSWORD=\"$MSSQL_SA_PASSWORD\"\
    \nif ! /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -C -b -i /bootstrap/sql-app.sql\
    \ -o /dev/null >/dev/null 2>&1; then\n  echo 'SQL application provisioning failed;\
    \ inspect privately. No existing identity was rotated.' >&2\n  exit 1\nfi\necho\
    \ 'New SQL application identity provisioned; no server administrator role assigned.'\n"
  sql-app.sql: "-- Only after sql-empty-schema succeeded, on a NEW database instance.\n\
    SET NOCOUNT ON;\nSET XACT_ABORT ON;\nIF DB_ID(N'ClimateGuard') IS NULL THROW 51000,\
    \ 'Initialize the new schema first.', 1;\nIF EXISTS (SELECT 1 FROM sys.server_principals\
    \ WHERE name=N'$(CG_SQL_APP_USER)')\n    THROW 51000, 'Identity already exists;\
    \ refusing replacement.', 1;\nBEGIN TRANSACTION;\nCREATE LOGIN [$(CG_SQL_APP_USER)]\
    \ WITH PASSWORD=N'$(CG_SQL_APP_PASSWORD)', CHECK_POLICY=ON;\nUSE [ClimateGuard];\n\
    CREATE USER [$(CG_SQL_APP_USER)] FOR LOGIN [$(CG_SQL_APP_USER)];\nALTER ROLE db_datareader\
    \ ADD MEMBER [$(CG_SQL_APP_USER)];\nALTER ROLE db_datawriter ADD MEMBER [$(CG_SQL_APP_USER)];\n\
    GRANT EXECUTE TO [$(CG_SQL_APP_USER)];\nCOMMIT;\n"
---
