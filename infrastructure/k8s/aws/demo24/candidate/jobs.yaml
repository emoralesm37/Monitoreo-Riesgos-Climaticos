apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/part-of: climateguard
  name: provision-alert-db
  namespace: climateguard
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bootstrap
        app.kubernetes.io/part-of: climateguard
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - node
        - /bootstrap/provision-postgres.cjs
        env:
        - name: PGHOST
          value: alert-db
        - name: APP_DATABASE
          value: climateguard_alert
        - name: ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
