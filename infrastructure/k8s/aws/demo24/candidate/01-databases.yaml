apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/part-of: climateguard
  name: alert-db
  namespace: climateguard
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-db
      app.kubernetes.io/part-of: climateguard
  serviceName: alert-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-db
        app.kubernetes.io/part-of: climateguard
      annotations:
        climateguard.io/config-checksum: cc52c5ef10f3dc24bb8135a7419e0c51c1644bd46760573fd6e0697bd348944d
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_DB
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: alert-db-admin
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: postgres@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        livenessProbe:
          periodSeconds: 20
          tcpSocket:
            port: db
          timeoutSeconds: 5
        name: alert-db
        ports:
        - containerPort: 5432
          name: db
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U postgres -d postgres
              -tAc "SELECT 1" >/dev/null
          failureThreshold: 3
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 320Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 60
          periodSeconds: 5
          tcpSocket:
            port: db
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
      volumes:
      - emptyDir:
          sizeLimit: 256Mi
        name: tmp
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
      storageClassName: cg-retain
---
