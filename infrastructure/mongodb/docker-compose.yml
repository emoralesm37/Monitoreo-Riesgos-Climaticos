services:
  mongodb:
    image: mongo:7.0
    container_name: climateguard-mongodb

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Falta MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Falta MONGO_ROOT_PASSWORD}

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongodb_data:/data/db

    networks:
      - climateguard-mongodb-network

    restart: unless-stopped

    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 })"'
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mongodb_data:
    name: climateguard-mongodb-data

networks:
  climateguard-mongodb-network:
    name: climateguard-mongodb-network
    driver: bridge
