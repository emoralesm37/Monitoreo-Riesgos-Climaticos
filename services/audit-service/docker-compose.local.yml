name: climateguard-audit-local
services:
  audit-service:
    build: .
    image: climateguard-audit-service:local
    restart: unless-stopped
    ports: ["127.0.0.1:8001:8001"]
    environment:
      MONGO_HOST: climateguard-mongodb
      MONGO_PORT: "27017"
      MONGO_DATABASE: ClimateGuardAudit
      MONGO_AUDIT_USERNAME: ${MONGO_AUDIT_USERNAME:?Required}
      MONGO_AUDIT_PASSWORD: ${MONGO_AUDIT_PASSWORD:?Required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Required}
      JWT_ISSUER: ${JWT_ISSUER:?Required}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Required}
      AUDIT_INGEST_KEY: ${AUDIT_INGEST_KEY:?Required}
    networks: [mongodb]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=4).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
networks:
  mongodb:
    external: true
    name: climateguard-mongodb-network
