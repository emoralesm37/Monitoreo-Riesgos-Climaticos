spring.application.name=alert-service
server.port=${SERVER_PORT:7301}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/climateguard_alert}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:climateguard_alert}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:climateguard_alert_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

security.jwt.secret=${JWT_ACCESS_SECRET}
security.jwt.issuer=${JWT_ISSUER:ClimateGuard.Auth}
security.jwt.audience=${JWT_AUDIENCE:ClimateGuard.Services}

alert.rules-url=${ALERT_RULES_URL:http://localhost:5147/api/alert-rules/evaluation}
