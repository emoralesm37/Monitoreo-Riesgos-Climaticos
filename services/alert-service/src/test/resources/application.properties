spring.datasource.url=jdbc:h2:mem:alert_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.flyway.enabled=false

security.jwt.secret=alert-service-test-secret-key-123456789
security.jwt.issuer=ClimateGuard.Auth
security.jwt.audience=ClimateGuard.Services